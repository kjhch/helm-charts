# This is a basic workflow to help you get started with Actions

name: 部署fridge-monitor

# Controls when the workflow will run. Triggers the workflow on push or pull request
# events but only for the "master" branch
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'docker image tag'
        required: true
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: self-hosted

    # Steps represent a sequence of tasks that you want this task to execute
    steps:
      - name: helm部署
        run: |
          echo "image tag: ${{ inputs.tag }}"
          sudo helm repo update
          sudo helm upgrade --install fridge-monitor kjhch/fridge-monitor --set image.tag=${{ inputs.tag }}
